apiVersion: v1
kind: Service
metadata:
  name: signaldesk-postgresql-headless
  namespace: signaldesk
  labels:
    app.kubernetes.io/name: signaldesk-postgresql
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: signaldesk-postgresql
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: signaldesk-postgresql
  namespace: signaldesk
  labels:
    app.kubernetes.io/name: signaldesk-postgresql
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: signaldesk-postgresql
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: signaldesk-postgresql
  namespace: signaldesk
  labels:
    app.kubernetes.io/name: signaldesk-postgresql
spec:
  serviceName: signaldesk-postgresql-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: signaldesk-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signaldesk-postgresql
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: incidentops
            - name: POSTGRES_USER
              value: incident_app
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: signaldesk-db
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U incident_app -d incidentops"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U incident_app -d incidentops"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: signaldesk-gp3
        resources:
          requests:
            storage: 10Gi
