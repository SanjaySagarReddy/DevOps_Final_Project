name: Verify, scan, and publish

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Test API and build frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Run isolated API tests
        working-directory: backend
        run: python -m pytest -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  publish:
    name: Build, scan, and publish SHA images
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set SHA image references
        id: images
        shell: bash
        run: |
          set -euo pipefail
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          owner="$(printf '%s' "$repository" | cut -d / -f 1)"
          name="$(printf '%s' "$repository" | cut -d / -f 2)"
          echo "backend=ghcr.io/$owner/$name-backend:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/$owner/$name-frontend:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        env:
          IMAGE: ${{ steps.images.outputs.backend }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE" ./backend

      - name: Build frontend image
        env:
          IMAGE: ${{ steps.images.outputs.frontend }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE" ./frontend

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.76.0
          cache: true

      - name: Scan backend image for HIGH and CRITICAL vulnerabilities
        env:
          IMAGE: ${{ steps.images.outputs.backend }}
        run: trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress "$IMAGE"

      - name: Scan frontend image for HIGH and CRITICAL vulnerabilities
        env:
          IMAGE: ${{ steps.images.outputs.frontend }}
        run: trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress "$IMAGE"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push both scanned images
        env:
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}
        run: |
          docker push "$BACKEND_IMAGE"
          docker push "$FRONTEND_IMAGE"
