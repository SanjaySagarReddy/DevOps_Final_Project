apiVersion: v1
kind: Service
metadata:
  name: {{ include "signaldesk.fullname" . }}-backend
  labels:
    app.kubernetes.io/name: signaldesk-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: signaldesk-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.backend.servicePort }}
      targetPort: http
