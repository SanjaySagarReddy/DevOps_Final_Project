{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "signaldesk.fullname" . }}-grafana-dashboard
  labels:
    app.kubernetes.io/name: signaldesk
    app.kubernetes.io/instance: {{ .Release.Name }}
    grafana_dashboard: "1"
data:
  signaldesk.json: |-
{{ .Files.Get "dashboards/signaldesk.json" | indent 4 }}
{{- end }}
