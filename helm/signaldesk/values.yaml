# Set these to the exact SHA images published by the phase 3 workflow.
global:
  imageTag: ""

# Create this pull secret in the release namespace for private GHCR packages.
# Set to [] when both packages are public.
imagePullSecrets:
  - name: ghcr-pull

database:
  existingSecret: signaldesk-db
  urlKey: database-url

backend:
  image:
    repository: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  servicePort: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

frontend:
  image:
    repository: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  servicePort: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

ingress:
  enabled: true
  className: nginx
  host: ""
  annotations: {}
